name: Deploy to GitHub Pages

on:
  push:
    branches: [main, www]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Each repository deploys one branch (repository variable DEPLOY_BRANCH).
    if: github.ref_name == vars.DEPLOY_BRANCH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
